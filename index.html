<title>Groundwork Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">

<style>
/* ── tokens ───────────────────────────────────────────────────────────────
   Concrete and hi-vis: cool grey grounds, graphite ink, one burnt-orange
   accent that doubles as the "act now" stage. Monospace is demoted to
   figures only - it was carrying the whole old page and that is why the
   market read as a terminal dump instead of a product. */
:root{
  --bg:#EDEFF1; --surface:#FFFFFF; --sunk:#E2E6E9; --raise:#F7F9FA;
  --ink:#14181A; --ink2:#4B5359; --ink3:#7A848A;
  --rule:#D3D9DD; --rule2:#E4E9EC;
  --accent:#BF400C; --accent-ink:#A63709; --accent-soft:rgba(191,64,12,.09);
  --bid:#BF400C;    --bid-soft:rgba(191,64,12,.10);
  --appr:#136B35;   --appr-soft:rgba(19,107,53,.10);
  --awd:#3C4A55;    --awd-soft:rgba(60,74,85,.10);
  --early:#8A6209;  --early-soft:rgba(138,98,9,.11);
  --shadow:0 1px 2px rgba(20,24,26,.06),0 8px 24px rgba(20,24,26,.07);
  --drawer:0 0 0 1px rgba(20,24,26,.06),-18px 0 44px rgba(20,24,26,.13);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1315; --surface:#171C1F; --sunk:#0B0E10; --raise:#1D2327;
    --ink:#E9EEF0; --ink2:#A4AEB4; --ink3:#768188;
    --rule:#2A3238; --rule2:#222A2F;
    --accent:#F97316; --accent-ink:#FB8B3C; --accent-soft:rgba(249,115,22,.15);
    --bid:#F97316;   --bid-soft:rgba(249,115,22,.15);
    --appr:#46B968;  --appr-soft:rgba(70,185,104,.14);
    --awd:#94A3B0;   --awd-soft:rgba(148,163,176,.13);
    --early:#DDA92F; --early-soft:rgba(221,169,47,.14);
    --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.38);
    --drawer:0 0 0 1px rgba(255,255,255,.05),-18px 0 48px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1315; --surface:#171C1F; --sunk:#0B0E10; --raise:#1D2327;
  --ink:#E9EEF0; --ink2:#A4AEB4; --ink3:#768188;
  --rule:#2A3238; --rule2:#222A2F;
  --accent:#F97316; --accent-ink:#FB8B3C; --accent-soft:rgba(249,115,22,.15);
  --bid:#F97316;   --bid-soft:rgba(249,115,22,.15);
  --appr:#46B968;  --appr-soft:rgba(70,185,104,.14);
  --awd:#94A3B0;   --awd-soft:rgba(148,163,176,.13);
  --early:#DDA92F; --early-soft:rgba(221,169,47,.14);
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.38);
  --drawer:0 0 0 1px rgba(255,255,255,.05),-18px 0 48px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; font-weight:600; letter-spacing:-.014em; text-wrap:balance}
p{margin:0}
button{font:inherit; color:inherit}
.n{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace; font-variant-numeric:tabular-nums}
:where(a,button,select,input,[tabindex]):focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── masthead ─────────────────────────────────────────────────────────── */
.top{position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:1px solid var(--rule)}
.topin{max-width:1380px; margin:0 auto; padding:11px clamp(12px,2.2vw,26px);
  display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.mark{display:flex; align-items:baseline; gap:9px; margin-right:auto}
.mark b{font-size:19px; font-weight:700; letter-spacing:-.03em}
.mark .bar{width:20px; height:3px; background:var(--accent); display:inline-block; margin-right:2px}
.mark span{font-size:11.5px; color:var(--ink3); letter-spacing:.03em}
.topstat{display:flex; gap:22px}
.topstat div{text-align:right}
.topstat b{display:block; font-size:15px; font-weight:600; line-height:1.15}
.topstat span{font-size:10.5px; color:var(--ink3); text-transform:uppercase; letter-spacing:.07em}

.shell{max-width:1380px; margin:0 auto; padding:clamp(16px,2.4vw,26px) clamp(12px,2.2vw,26px) 60px}

/* ── stage tiles: the three-second answer ─────────────────────────────── */
.stages{display:grid; grid-template-columns:repeat(auto-fit,minmax(212px,1fr)); gap:10px; margin-bottom:16px}
.stage{
  position:relative; text-align:left; cursor:pointer; background:var(--surface);
  border:1px solid var(--rule); border-radius:6px; padding:14px 15px 13px;
  box-shadow:var(--shadow); transition:border-color .12s, transform .12s;
}
.stage:hover{border-color:var(--ink3)}
.stage::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
  border-radius:6px 0 0 6px; background:var(--c)}
.stage[aria-pressed="true"]{border-color:var(--c); background:var(--cs)}
.stage .lab{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; color:var(--c)}
.stage .amt{display:block; font-size:27px; font-weight:600; letter-spacing:-.03em; line-height:1.15; margin-top:7px}
.stage .cnt{display:block; font-size:12.5px; color:var(--ink3); margin-top:2px}
.stage .blurb{display:block; font-size:12px; color:var(--ink2); margin-top:8px; line-height:1.4}
.stage[data-k="0"]{--c:var(--bid); --cs:var(--bid-soft)}
.stage[data-k="1"]{--c:var(--appr); --cs:var(--appr-soft)}
.stage[data-k="2"]{--c:var(--awd); --cs:var(--awd-soft)}
.stage[data-k="3"]{--c:var(--early); --cs:var(--early-soft)}

/* ── lede: says what this is worth before any row is read ─────────────── */
.lede{background:var(--surface); border:1px solid var(--rule); border-left:4px solid var(--accent);
  border-radius:6px; padding:15px 18px; margin-bottom:16px; box-shadow:var(--shadow); max-width:none}
.lede h2{font-size:17px; margin-bottom:5px}
.lede p{font-size:13.5px; color:var(--ink2); line-height:1.55; max-width:90ch}
.lede b{color:var(--ink); font-weight:600}

/* ── toolbar ──────────────────────────────────────────────────────────── */
.tog{display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--ink2);
  border:1px solid var(--rule); border-radius:5px; padding:8px 11px; cursor:pointer;
  background:var(--surface); min-height:38px}
.tog:hover{border-color:var(--ink3)}
.tog input{margin:0; accent-color:var(--accent)}
.tools{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px}
.tools input,.tools select{
  font:inherit; font-size:13.5px; color:var(--ink); background:var(--surface);
  border:1px solid var(--rule); border-radius:5px; padding:8px 10px; min-height:38px;
}
#q{flex:1 1 240px; min-width:0}
.tools select{cursor:pointer}
.reset{background:none; border:1px solid var(--rule); border-radius:5px; padding:8px 12px;
  font-size:13px; cursor:pointer; color:var(--ink2); min-height:38px}
.reset:hover{border-color:var(--ink3); color:var(--ink)}

.rescount{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:0 2px 10px}
.rescount b{font-size:15px; font-weight:600}
.rescount span{font-size:13px; color:var(--ink3)}

/* ── the board ────────────────────────────────────────────────────────── */
.boardwrap{background:var(--surface); border:1px solid var(--rule); border-radius:6px;
  box-shadow:var(--shadow); overflow:hidden}
/* overflow-x:auto forces overflow-y to compute to auto as well, which makes
   this element the scrollport the sticky header sticks to. So give it a real
   height and let the board scroll inside itself - the filters stay put, which
   is what a work board wants anyway. */
.scroller{overflow:auto; max-height:calc(100vh - 250px); min-height:280px; overscroll-behavior:contain}
/* color:inherit is not redundant. This file ships without a doctype because
   the artifact host supplies the page skeleton - so opening board.html
   straight off disk lands in quirks mode, where a table does NOT inherit
   colour and the rows render in the light-theme ink on a dark ground. */
table{border-collapse:collapse; width:100%; min-width:880px; color:inherit}
thead th{
  position:sticky; top:0; z-index:10; background:var(--raise); text-align:left;
  font-size:10.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink3);
  font-weight:600; padding:9px 12px; border-bottom:1px solid var(--rule); white-space:nowrap;
}
thead th.sortable{cursor:pointer; user-select:none}
thead th.sortable:hover{color:var(--ink)}
thead th .ar{opacity:.35; margin-left:3px}
thead th[aria-sort] .ar{opacity:1; color:var(--accent-ink)}
tbody tr{cursor:pointer; border-bottom:1px solid var(--rule2)}
tbody tr:last-child{border-bottom:0}
tbody tr:hover{background:var(--sunk)}
tbody tr.on{background:var(--accent-soft)}
td{padding:10px 12px; vertical-align:top; font-size:13.5px; line-height:1.42}
td.dt{white-space:nowrap; color:var(--ink2); font-size:12.5px}
td.money{text-align:right; white-space:nowrap; font-weight:600}
td.money .cap{display:block; font-size:10px; color:var(--ink3); font-weight:400; letter-spacing:.02em}
td.money .none{color:var(--ink3); font-weight:400}
td.what{min-width:300px; max-width:560px}
td.what .t{display:block; overflow:hidden; text-overflow:ellipsis; display:-webkit-box;
  -webkit-line-clamp:2; -webkit-box-orient:vertical}
td.who{white-space:nowrap; font-size:13px}
.pill{display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
  font-size:11px; font-weight:600; padding:3px 8px; border-radius:20px;
  background:var(--cs); color:var(--c); border:1px solid var(--c)}
.pill[data-k="0"]{--c:var(--bid); --cs:var(--bid-soft)}
.pill[data-k="1"]{--c:var(--appr); --cs:var(--appr-soft)}
.pill[data-k="2"]{--c:var(--awd); --cs:var(--awd-soft)}
.pill[data-k="3"]{--c:var(--early); --cs:var(--early-soft)}
.trade{font-size:11px; color:var(--ink3); letter-spacing:.04em; white-space:nowrap}
.won{display:block; margin-top:3px; font-size:11.5px; font-weight:600; color:var(--accent-ink)}
.won::before{content:"▸ "; opacity:.6}
.empty{padding:52px 20px; text-align:center; color:var(--ink3)}
.empty b{display:block; color:var(--ink); font-size:16px; margin-bottom:6px}

/* ── coverage ledger: the gaps ship with the numbers ──────────────────── */
.ledger{margin-top:16px; border:1px solid var(--rule); border-radius:6px;
  background:var(--surface); padding:15px 18px; font-size:13px; color:var(--ink2)}
.ledger h3{font-size:11px; text-transform:uppercase; letter-spacing:.1em;
  color:var(--ink3); margin-bottom:9px}
.ledger p{margin-bottom:9px; line-height:1.55; max-width:92ch}
.ledger b{color:var(--ink); font-weight:600}
.ledger ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:4px}
.ledger li{line-height:1.5}

/* ── drawer ───────────────────────────────────────────────────────────── */
.scrim{position:fixed; inset:0; background:rgba(10,14,16,.42); opacity:0; pointer-events:none;
  transition:opacity .16s; z-index:40}
.scrim.open{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:min(560px,100vw); z-index:50;
  background:var(--surface); box-shadow:var(--drawer); transform:translateX(100%);
  transition:transform .2s ease; display:flex; flex-direction:column;
}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){ .drawer,.scrim{transition:none} }
.dhead{padding:16px 20px; border-bottom:1px solid var(--rule); display:flex; gap:12px; align-items:flex-start}
.dhead .x{margin-left:auto; background:none; border:1px solid var(--rule); border-radius:5px;
  width:32px; height:32px; cursor:pointer; color:var(--ink2); flex:none; font-size:16px; line-height:1}
.dhead .x:hover{border-color:var(--ink3); color:var(--ink)}
.dbody{overflow-y:auto; padding:20px; flex:1}
.dmoney{font-size:34px; font-weight:600; letter-spacing:-.03em; line-height:1.1}
.dmoney small{display:block; font-size:12px; color:var(--ink3); font-weight:500; letter-spacing:.02em; margin-top:4px}
.story{font-size:16px; line-height:1.5; margin:14px 0 0}
.fld{border-top:1px solid var(--rule2); margin-top:18px; padding-top:14px}
.fld h3{font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink3); font-weight:600; margin-bottom:7px}
.fld p{font-size:13.5px; line-height:1.55; color:var(--ink2)}
.verbatim{background:var(--sunk); border-left:3px solid var(--rule); padding:11px 13px;
  font-size:13px; line-height:1.55; color:var(--ink2); border-radius:0 4px 4px 0}
.kv{display:flex; gap:8px; font-size:13.5px; padding:4px 0}
.kv b{min-width:96px; color:var(--ink3); font-weight:500; font-size:12.5px}
.thread{display:flex; flex-direction:column; gap:0}
.thread div{display:grid; grid-template-columns:76px 1fr auto; gap:10px; padding:7px 0;
  border-bottom:1px solid var(--rule2); font-size:12.5px; align-items:baseline}
.thread div:last-child{border-bottom:0}
.thread .d{color:var(--ink3)}
.thread .a{text-align:right; color:var(--ink2); white-space:nowrap}
.thread div.self{background:var(--accent-soft); margin:0 -8px; padding:7px 8px; border-radius:4px}
.acts{display:flex; gap:8px; flex-wrap:wrap; margin-top:18px}
.acts a,.acts button{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:500;
  text-decoration:none; border-radius:5px; padding:9px 13px; cursor:pointer; border:1px solid var(--rule);
  background:var(--surface); color:var(--ink)}
.acts .primary{background:var(--accent); border-color:var(--accent); color:#fff}
.acts .primary:hover{filter:brightness(1.07)}
.acts a:hover,.acts button:hover{border-color:var(--ink3)}

/* ── mobile: table becomes cards ──────────────────────────────────────── */
@media (max-width:860px){
  thead{display:none}
  table,tbody,tr,td{display:block; width:100%; min-width:0}
  table{min-width:0}
  .scroller{overflow-x:visible}
  .scroller{max-height:none; min-height:0}
  tbody tr{padding:12px 13px; border-bottom:1px solid var(--rule)}
  td{padding:0; border:0}
  td.dt{display:inline; color:var(--ink3)}
  td.who{display:inline; font-weight:600}
  td.who::before{content:" · "; color:var(--ink3); font-weight:400}
  td.what{max-width:none; margin:7px 0}
  td.stage-cell{margin:8px 0 0; display:inline-block}
  td.money{text-align:left; display:inline-block; margin:8px 0 0 10px; font-size:15px}
  td.trade-cell{display:inline-block; margin-left:10px}
  td.chev{display:none}
  thead th{position:static}
  .drawer{width:100vw}
}
</style>

<header class="top">
  <div class="topin">
    <div class="mark">
      <b><span class="bar"></span>GROUNDWORK</b>
      <span id="fresh"></span>
    </div>
    <div class="topstat">
      <div><b class="n" id="tDollars"></b><span>on the table</span></div>
      <div><b class="n" id="tLeads"></b><span>projects</span></div>
      <div><b class="n" id="tBoards"></b><span>boards</span></div>
    </div>
  </div>
</header>

<div class="shell">
  <h1 class="vh">Groundwork — public money moving through Western New York boards</h1>

  <div class="lede" id="lede"></div>

  <div class="stages" id="stages"></div>

  <div class="tools">
    <label class="vh" for="q">Search projects</label>
    <input id="q" type="search" placeholder="Search a road, a project, or a contractor who won one…" autocomplete="off">
    <label class="vh" for="fTown">Board</label>
    <select id="fTown"></select>
    <label class="vh" for="fTrade">Trade</label>
    <select id="fTrade"></select>
    <label class="vh" for="fMin">Minimum amount</label>
    <select id="fMin"></select>
    <label class="tog"><input type="checkbox" id="fWork" checked> Construction only</label>
    <button class="reset" id="reset" type="button">Clear</button>
  </div>

  <div class="rescount">
    <b id="rc"></b><span id="rcAmt"></span><span id="rcNote"></span>
  </div>

  <div class="boardwrap">
    <div class="scroller">
      <table>
        <thead><tr>
          <th class="sortable" data-s="date">Date<span class="ar">↓</span></th>
          <th>Stage</th>
          <th>Board</th>
          <th>Project</th>
          <th>Trade</th>
          <th class="sortable" data-s="amt" style="text-align:right">Amount<span class="ar">↕</span></th>
          <th></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden></div>
  </div>

  <div class="ledger" id="ledger"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" aria-hidden="true">
  <div class="dhead">
    <div>
      <div id="dPill"></div>
      <h2 id="dTitle" style="font-size:17px;margin-top:8px">—</h2>
    </div>
    <button class="x" id="dClose" type="button" aria-label="Close">✕</button>
  </div>
  <div class="dbody" id="dBody"></div>
</aside>

const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TOWN = Object.fromEntries(D.towns.map(t=>[t.k,t]));
const STAGE = Object.fromEntries(D.stages.map(s=>[s.k,s]));

/* Amounts: compact in the table so the column scans, exact in the drawer so
   nothing important is rounded away in the one place a number gets acted on. */
function money(v,{exact=false}={}){
  if(v==null) return null;
  if(exact) return "$"+Math.round(v).toLocaleString("en-US");
  if(v>=1e6) return "$"+(v/1e6).toFixed(v>=1e7?0:1).replace(/\.0$/,"")+"M";
  if(v>=1e3) return "$"+Math.round(v/1e3)+"K";
  return "$"+Math.round(v).toLocaleString("en-US");
}
const DTF = {month:"short", day:"numeric"};
function fdate(s,long){
  if(!s) return "—";
  const d=new Date(s+"T12:00:00");
  return d.toLocaleDateString("en-US", long?{month:"long",day:"numeric",year:"numeric"}:DTF);
}

/* One plain-English sentence, composed from structured fields - never an AI
   summary. Same rule the pipeline already follows for its own copy. */
function story(r){
  const board=TOWN[r.co]?.name||r.co, when=fdate(r.date,true), amt=money(r.amt,{exact:true});
  const cap=r.cap?" (a ceiling, not a price)":"";
  let s;
  if(r.sec===0) s=`${board} put this work out for bid on ${when}.`;
  else if(r.sec===1) s=amt?`${board} approved ${amt}${cap} for this on ${when}.`
                         :`${board} approved this on ${when}.`;
  else if(r.sec===2){
    const to=r.vendor?` to ${r.vendor}`:"";
    s=amt?`${board} awarded this work${to} on ${when} for ${amt}${cap}.`
         :`${board} awarded this work${to} on ${when}.`;
  }
  else s=`${board} took this up on ${when}, before any award.`;
  if(r.ayes!=null) s+=` The roll call printed ${r.ayes} aye${r.ayes===1?"":"s"}`+
    (r.noes?` and ${r.noes} no${r.noes===1?"":"es"}.`:" and no opposition.");
  else if(r.out) s+=` Recorded as ${r.out.toLowerCase()}.`;
  return s;
}
function nextStep(r){
  /* Stage 3 items can still carry a procedural roll call, so this line must
     say "no award yet" rather than "no vote yet" - the drawer prints the

  return {0:"Get the bid package from the clerk now — this one is open.",
          1:"Money is voted. Watch for the advertisement and line up your number.",

          3:"No award yet. This is the moment to be known before the spec is written."}[r.sec];
}

/* Approved money is only a lead if you know WHEN it turns into a bid. The
   pipeline measured that gap from matched approve→award pairs, so this is a
   observed distribution, not a guess — and it names its own sample size. */
function forecast(r){
  if(r.sec!==1 || !r.date || !D.clock) return "";
  const c=(D.clock.trade&&D.clock.trade[r.tr]&&D.clock.trade[r.tr].n>=3)
    ? {...D.clock.trade[r.tr], lbl:`${r.tr.toLowerCase()} project${D.clock.trade[r.tr].n===1?"":"s"}`}
    : (D.clock.overall ? {...D.clock.overall, lbl:"projects across all trades"} : null);
  if(!c) return "";
  const add=d=>{const x=new Date(r.date+"T12:00:00"); x.setDate(x.getDate()+Math.round(d));
    return x.toLocaleDateString("en-US",{month:"short",year:"numeric"});};
  const past=(Date.parse(r.date)+c.med*864e5)<Date.now();
  return `<div class="fld"><h3>When the bid should land</h3>
    <p class="lead" style="color:var(--ink)">${add(c.p25)} – ${add(c.p75)}${past
      ? ` <span style="color:var(--accent-ink)">· median already passed, chase it now</span>` : ""}</p>
    <p>Measured, not guessed: across <b>${c.n} ${c.lbl}</b> in this record the award landed
    a median of <b>${Math.round(c.med)} days</b> after the money was voted
    (middle half ${Math.round(c.p25)}–${Math.round(c.p75)} days).</p></div>`;
}

/* ── state ─────────────────────────────────────────────────────────────── */
const S={stages:new Set(), q:"", town:"", trade:"", min:0, work:true, sort:"date", dir:-1};
let CUR=null;

/* The lede exists because the honest headline is not "427 leads". It is that
   nobody advertises a letting in these minutes, and the sellable thing is the
   money that is already voted and not yet awarded. */
{
  const t=D.totals, approved=D.leads.filter(r=>r.sec===1&&r.work).reduce((a,b)=>a+(b.amt||0),0);
  $("#lede").innerHTML=`<h2>${t.openLettings===0
    ? "No board here is advertising an open bid right now."
    : `${t.openLettings} open letting${t.openLettings===1?"":"s"} right now.`}</h2>
    <p>${t.openLettings===0
      ? `That is the real answer, not an empty page: these ${t.boards} boards <b>award</b> contracts in their minutes, they rarely <b>advertise</b> them there. So the thing worth having is the money <b>before</b> the bid — <b>${money(approved)} already voted and not yet awarded</b>, plus every award on the record as your pricing comparable.`
      : `Act on those first.`}
      Of ${t.leads} recorded items, <b>${t.work} are construction</b>; the other ${t.admin}
      are rezonings, appointments and budget moves, hidden by default.${D.vendorLedger
        ? ` And <b>${D.vendorLedger.named} of ${D.vendorLedger.awards} awards name the winning
            contractor</b>, read out of the board's own resolution — that is your comparable
            and your competition.` : ""}</p>`;
}

$("#fresh").textContent = D.refreshed ? "Refreshed "+D.refreshed : "";
$("#tDollars").textContent = money(D.totals.dollars);
$("#tLeads").textContent = D.totals.leads;
$("#tBoards").textContent = D.totals.boards;

/* stage tiles */
$("#stages").innerHTML = D.stages.map(s=>{
  const rs=D.leads.filter(r=>r.sec===s.k&&r.work), sum=rs.reduce((a,b)=>a+(b.amt||0),0);
  /* Out-for-bid items usually carry no dollar figure yet, and a big "—" made
     the most valuable stage look empty. Lead with whichever number is real. */
  const big = sum ? money(sum) : rs.length;
  const sub = sum ? `${rs.length} project${rs.length===1?"":"s"}`
                  : `project${rs.length===1?"":"s"} · no dollar figure yet`;
  return `<button class="stage" data-k="${s.k}" aria-pressed="false" type="button">
    <span class="lab">${esc(s.name)}</span>
    <span class="amt n">${big}</span>
    <span class="cnt n">${sub}</span>
    <span class="blurb">${esc(s.blurb)}</span>
  </button>`;
}).join("");
$("#stages").addEventListener("click",e=>{
  const b=e.target.closest(".stage"); if(!b) return;
  const k=+b.dataset.k;
  S.stages.has(k)?S.stages.delete(k):S.stages.add(k);
  b.setAttribute("aria-pressed",String(S.stages.has(k)));
  render();
});

/* selects */
$("#fTown").innerHTML = `<option value="">All 16 boards</option>` +
  D.towns.map(t=>`<option value="${esc(t.k)}">${esc(t.name)}</option>`).join("");
$("#fTrade").innerHTML = `<option value="">All trades</option>` +
  D.trades.map(t=>`<option value="${esc(t)}">${esc(t==="OTHER"?"Other / unclassified":t)}</option>`).join("");
$("#fMin").innerHTML = [[0,"Any amount"],[25e3,"$25K+"],[100e3,"$100K+"],[500e3,"$500K+"],[1e6,"$1M+"]]
  .map(([v,l])=>`<option value="${v}">${l}</option>`).join("");

$("#q").addEventListener("input",e=>{S.q=e.target.value.trim().toLowerCase(); render();});
$("#fTown").addEventListener("change",e=>{S.town=e.target.value; render();});
$("#fTrade").addEventListener("change",e=>{S.trade=e.target.value; render();});
$("#fMin").addEventListener("change",e=>{S.min=+e.target.value; render();});
$("#fWork").addEventListener("change",e=>{S.work=e.target.checked; render();});
$("#reset").addEventListener("click",()=>{
  S.stages.clear(); S.q=""; S.town=""; S.trade=""; S.min=0; S.work=true;
  $("#q").value=""; $("#fTown").value=""; $("#fTrade").value=""; $("#fMin").value="0";
  $("#fWork").checked=true;
  document.querySelectorAll(".stage").forEach(b=>b.setAttribute("aria-pressed","false"));
  render();
});
document.querySelectorAll("th.sortable").forEach(th=>{
  th.addEventListener("click",()=>{
    const s=th.dataset.s;
    if(S.sort===s) S.dir*=-1; else {S.sort=s; S.dir=-1;}
    document.querySelectorAll("th.sortable").forEach(o=>o.removeAttribute("aria-sort"));
    th.setAttribute("aria-sort",S.dir===-1?"descending":"ascending");
    th.querySelector(".ar").textContent=S.dir===-1?"↓":"↑";
    render();
  });
});

function match(r){
  if(S.work && !r.work) return false;
  if(S.stages.size && !S.stages.has(r.sec)) return false;
  if(S.town && r.co!==S.town) return false;
  if(S.trade && r.tr!==S.trade) return false;
  if(S.min && !(r.amt>=S.min)) return false;
  if(S.q){
    const hay=(r.title+" "+(TOWN[r.co]?.name||r.co)+" "+r.tr+" "+r.id+" "+(r.vendor||"")).toLowerCase();
    if(!hay.includes(S.q)) return false;
  }
  return true;
}

function render(){
  let rs=D.leads.filter(match);
  rs.sort((a,b)=> S.sort==="amt"
    ? ((a.amt??-1)-(b.amt??-1))*S.dir
    : (a.date<b.date?-1:a.date>b.date?1:0)*S.dir);

  const sum=rs.reduce((a,b)=>a+(b.amt||0),0), priced=rs.filter(r=>r.amt!=null).length;
  $("#rc").textContent=`${rs.length} project${rs.length===1?"":"s"}`;
  $("#rcAmt").textContent=sum?`· ${money(sum)} on the table`:"";
  $("#rcNote").textContent=rs.length&&priced<rs.length
    ? `· ${rs.length-priced} carry no printed figure` : "";

  const empty=$("#empty");
  if(!rs.length){
    empty.hidden=false;
    empty.innerHTML=`<b>Nothing matches those filters.</b>That is an honest answer, not a bug — the board only shows what a clerk actually voted on.${S.work?" Untick <b>Construction only</b> to include rezonings, appointments and budget moves.":" Widen the filters or clear them."}`;
    $("#rows").innerHTML=""; return;
  }
  empty.hidden=true;

  $("#rows").innerHTML=rs.map(r=>{
    const t=TOWN[r.co]; const st=STAGE[r.sec];
    return `<tr data-id="${esc(r.id)}" tabindex="0" role="button" aria-label="${esc(r.title.slice(0,90))}">
      <td class="dt n">${fdate(r.date)}</td>
      <td class="stage-cell"><span class="pill" data-k="${r.sec}">${esc(st?st.name:"—")}</span></td>
      <td class="who">${esc(t?t.short:r.co)}</td>
      <td class="what"><span class="t">${esc(r.label||r.title)}</span>${
        r.vendor?`<span class="won">won by ${esc(r.vendor)}</span>`:""}</td>
      <td class="trade-cell"><span class="trade">${esc(r.tr==="OTHER"?"—":r.tr)}</span></td>
      <td class="money n">${r.amt!=null?money(r.amt)+(r.cap?`<span class="cap">cap</span>`:"")
        :`<span class="none">no figure</span>`}</td>
      <td class="chev" style="color:var(--ink3)">›</td>
    </tr>`;
  }).join("");
}

/* ── drawer ────────────────────────────────────────────────────────────── */
const drawer=$("#drawer"), scrim=$("#scrim");
let lastFocus=null;

function open(id){
  const r=D.leads.find(x=>x.id===id); if(!r) return;
  CUR=r; lastFocus=document.activeElement;
  document.querySelectorAll("tbody tr").forEach(tr=>tr.classList.toggle("on",tr.dataset.id===id));
  const t=TOWN[r.co], st=STAGE[r.sec];
  $("#dPill").innerHTML=`<span class="pill" data-k="${r.sec}">${esc(st?st.name:"")}</span>`;
  $("#dTitle").textContent=(t?t.name:r.co)+" · "+fdate(r.date,true);

  const figs=(r.am||[]).filter(a=>a&&a.v!=null);
  const th=r.th||{}; const rows=(th.rows||[]);

  $("#dBody").innerHTML=`
    <div class="dmoney${r.amt!=null?" n":""}">${r.amt!=null?money(r.amt,{exact:true}):"No figure printed"}
      <small>${r.amt!=null?(r.cap?"A ceiling — the job will not exceed this":"As printed in the record")
        :"The clerk recorded no dollar figure on this item"}</small></div>
    <p class="story">${esc(story(r))}</p>
    <div class="fld"><h3>What to do</h3><p style="color:var(--ink)">${esc(nextStep(r))}</p></div>
    ${forecast(r)}
    ${r.vendor?`<div class="fld"><h3>Who won it</h3>
      <p style="color:var(--ink);font-size:15px;font-weight:600">${esc(r.vendor)}</p>
      <p>Named in the board's own resolution. Treat as your comparable and your competition.</p></div>`:""}
    <div class="fld"><h3>The board's own words</h3><div class="verbatim">${esc(r.title)}</div></div>
    ${(r.ayes!=null||r.out||r.mover)?`<div class="fld"><h3>The vote</h3>
      ${r.ayes!=null?`<div class="kv"><b>Tally</b><span class="n">${r.ayes} aye${r.ayes===1?"":"s"}${r.noes?` · ${r.noes} no`:" · no opposition"}</span></div>`:""}
      ${r.out?`<div class="kv"><b>Outcome</b><span>${esc(r.out)}</span></div>`:""}
      ${r.mover?`<div class="kv"><b>Moved by</b><span>${esc(r.mover)}</span></div>`:""}
    </div>`:""}
    ${figs.length?`<div class="fld"><h3>Every figure in the record · ${figs.length}</h3>
      ${figs.map(a=>`<div class="kv"><b class="n">${money(a.v,{exact:true})}</b><span>${esc(a.k||a.t||"")}</span></div>`).join("")}
    </div>`:""}
    ${rows.length?`<div class="fld"><h3>This project's history · ${rows.length} record${rows.length===1?"":"s"}${th.y0?` · ${th.y0}–${th.y1}`:""}</h3>
      <div class="thread">${rows.map(x=>`<div class="${x.id===r.id?"self":""}">
        <span class="d n">${fdate(x.date)}</span><span>${esc((x.t||"").slice(0,110))}</span>
        <span class="a n">${x.amt?money(x.amt):""}</span></div>`).join("")}</div>
    </div>`:""}
    ${r.cm?`<div class="fld"><h3>Provenance</h3><p>${r.cm}</p></div>`:""}
    <div class="acts">
      ${r.src?`<a class="primary" href="${esc(r.src)}" target="_blank" rel="noopener noreferrer">Open the board's own document ↗</a>`:""}
      <button type="button" id="copy">Copy lead</button>
    </div>`;

  $("#copy")?.addEventListener("click",async e=>{
    const t=TOWN[r.co];
    const txt=[story(r), "", r.title, "",
      `${t?t.name:r.co} · ${fdate(r.date,true)}${r.amt!=null?` · ${money(r.amt,{exact:true})}`:""}`,
      r.src||""].join("\n");
    try{ await navigator.clipboard.writeText(txt); e.target.textContent="Copied"; }
    catch{ e.target.textContent="Press ⌘C"; }
    setTimeout(()=>{e.target.textContent="Copy lead";},1600);
  });

  drawer.classList.add("open"); scrim.classList.add("open");
  drawer.setAttribute("aria-hidden","false");
  $("#dClose").focus();
}
function close(){
  drawer.classList.remove("open"); scrim.classList.remove("open");
  drawer.setAttribute("aria-hidden","true");
  document.querySelectorAll("tbody tr.on").forEach(tr=>tr.classList.remove("on"));
  if(lastFocus&&lastFocus.isConnected) lastFocus.focus();
  CUR=null;
}
$("#rows").addEventListener("click",e=>{const tr=e.target.closest("tr"); if(tr) open(tr.dataset.id);});
$("#rows").addEventListener("keydown",e=>{
  if(e.key!=="Enter"&&e.key!==" ") return;
  const tr=e.target.closest("tr"); if(tr){e.preventDefault(); open(tr.dataset.id);}
});
$("#dClose").addEventListener("click",close);
scrim.addEventListener("click",close);
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&CUR) close(); });

/* The gaps ship with the numbers. A gap reported as a gap is a feature; it
   is what makes "pick any figure and we walk you to the line" honorable. */
{
  const L=D.vendorLedger, t=D.totals;
  const MISS={
    "no vendor pattern matched in window":"the resolution never names a contractor",
    "refused: name sits in a bid tabulation, winner not asserted":"a name was present but sat in a list of ALL bidders, so publishing it could have named a loser — refused",
    "vendor found but item amount absent from window (refused)":"a name was present but the item's own dollar figure was not, so it could not be tied to this award — refused",
    "no anchor: title not found in document":"the item's text could not be located in the posted document",
  };
  $("#ledger").innerHTML=`<h3>What this board knows, and what it doesn't</h3>
    ${L?`<p><b>Winning contractors: ${L.named} named of ${L.awards} awards.</b> ${esc(L.note)}</p>
    <ul>${Object.entries(L.misses).map(([k,v])=>
      `<li><b>${v}</b> — ${esc(MISS[k]||k)}</li>`).join("")}</ul>`:""}
    <p style="margin-top:11px">${t.openLettings===0
      ? "No open letting appears anywhere in this record, so the board never claims one."
      : ""} Every figure is transcribed from a board's own posted document and links back to it.
      Nothing here is estimated, and an item with no printed dollar figure is shown as
      <b>no figure</b> rather than filled in.</p>`;
}

render();
</script>
